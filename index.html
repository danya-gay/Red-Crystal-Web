<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RCAI | НАРОДНЫЙ ТЕРМИНАЛ</title>
    <style>
        :root { --color: #33ff33; --bg: #050a05; --shadow: rgba(51, 255, 51, 0.3); }
        body { background: var(--bg); color: var(--color); font-family: 'Courier New', monospace; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        .crt-effect { pointer-events: none; position: fixed; inset: 0; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03)); z-index: 200; background-size: 100% 2px, 3px 100%; }
        header { padding: 15px; border-bottom: 1px solid var(--color); text-align: center; letter-spacing: 2px; }
        #chat-log { flex-grow: 1; overflow-y: auto; padding: 20px; scroll-behavior: smooth; }
        .msg { margin-bottom: 12px; border-left: 3px solid var(--color); padding-left: 10px; }
        .user { color: #fff; border-color: #fff; }
        input, button { background: transparent; border: 1px solid var(--color); color: var(--color); padding: 12px; font-family: inherit; outline: none; }
        .input-area { display: flex; gap: 10px; padding: 20px; border-top: 1px solid var(--color); }
    </style>
</head>
<body>
    <div class="crt-effect"></div>
    <header>RCAI v.2.0 • НАРОДНЫЙ ТЕРМИНАЛ</header>
    <div id="chat-log"><div class="msg">СИСТЕМА: Соединение установлено. Жду запрос...</div></div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Введите сообщение..." style="flex-grow: 1;" onkeypress="if(event.key==='Enter') send()">
        <button onclick="send()">ОТПРАВИТЬ</button>
    </div>

    <script>
        // ЗАМЕНИТЕ ЭТУ ССЫЛКУ НА ВАШУ ИЗ VERCEL
        const BACKEND_URL = "https://rcai-backend.vercel.app/"; 

        async function send() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if(!text) return;

            addMsg('user', text);
            input.value = '';

            try {
                const response = await fetch(BACKEND_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: text })
                });
                const data = await response.json();
                addMsg('ai', data.answer || data.error);
            } catch(e) {
                addMsg('system', 'ОШИБКА: Узел связи не отвечает.');
            }
        }

        function addMsg(role, text) {
            const log = document.getElementById('chat-log');
            const div = document.createElement('div');
            div.className = `msg ${role === 'user' ? 'user' : ''}`;
            div.innerHTML = `<strong>${role === 'ai' ? 'RCAI' : role === 'user' ? 'ГРАЖДАНИН' : 'СИСТЕМА'}:</strong> ${text}`;
            log.appendChild(div);
            log.scrollTop = log.scrollHeight;
        }
    </script>
</body>
</html>
