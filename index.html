<script>
async function askRCAI() {
    const inputField = document.getElementById('user-input');
    const responseArea = document.getElementById('response');
    const prompt = inputField.value;

    if (!prompt) return;

    responseArea.innerHTML = "<em>Запрос отправлен в зашифрованный сектор...</em>";

    try {
        // СЮДА ВСТАВЬТЕ ВАШУ ССЫЛКУ ИЗ VERCEL
        const serverUrl = 'https://rcai-backend.vercel.app/api/ask'; 

        const response = await fetch(serverUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ prompt: prompt })
        });

        if (!response.ok) throw new Error('Шлюз Альянса недоступен');

        const data = await response.json();
        
        // Красиво выводим ответ от RCAI
        responseArea.innerText = data.answer;
        inputField.value = ''; // Очищаем поле ввода

    } catch (error) {
        responseArea.innerHTML = `<span style="color: red;">Ошибка: ${error.message}</span>`;
        console.error('Security Breach or Connection Error:', error);
    }
}
</script>
