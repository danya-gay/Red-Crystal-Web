<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RCAI | НАРОДНЫЙ ТЕРМИНАЛ</title>
    <style>
        body { background: #000; color: #ff3333; font-family: monospace; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        header { border-bottom: 2px solid #ff3333; padding: 20px; text-align: center; font-size: 1.5rem; text-shadow: 0 0 10px #ff3333; }
        #chat { flex-grow: 1; overflow-y: auto; padding: 20px; }
        .msg { margin-bottom: 15px; border-left: 2px solid #ff3333; padding-left: 10px; }
        .user { color: #fff; }
        .input-area { padding: 20px; border-top: 2px solid #ff3333; display: flex; }
        input { flex-grow: 1; background: #000; border: 1px solid #ff3333; color: #fff; padding: 10px; outline: none; }
        button { background: #ff3333; color: #000; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <header>КРАСНЫЙ АЛЬЯНС • RCAI 2.0</header>
    <div id="chat">
        <div class="msg">Система запущена. Жду ввод данных...</div>
    </div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Напишите народу..." onkeypress="if(event.key==='Enter') send()">
        <button onclick="send()">ОТПРАВИТЬ</button>
    </div>

    <script>
        // ВНИМАНИЕ: Если твой адрес в Vercel отличается, замени его ниже!
        const URL = "https://rcai-backend.vercel.app/"; 

        async function send() {
            const input = document.getElementById('userInput');
            const chat = document.getElementById('chat');
            const text = input.value;
            if (!text) return;

            chat.innerHTML += `<div class="msg user">Вы: ${text}</div>`;
            input.value = "";

            try {
                const response = await fetch(URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: text })
                });
                
                const data = await response.json();
                chat.innerHTML += `<div class="msg">RCAI: ${data.answer || data.error}</div>`;
            } catch (e) {
                chat.innerHTML += `<div class="msg" style="color:yellow">ОШИБКА СВЯЗИ: Проверьте ссылку URL в коде index.html. Сейчас она: ${URL}</div>`;
            }
            chat.scrollTop = chat.scrollHeight;
        }
    </script>
</body>
</html>
